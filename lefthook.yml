pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{astro,css,js,json,jsonc,mjs,svelte,ts}"
      run: biome check --write --no-errors-on-unmatched {staged_files}

    - name: rumdl
      glob: "*.{md,mdx}"
      run: rumdl fmt {staged_files}

    - name: tsc
      glob: "*.{ts,mts,cts}"
      run: tsc --noEmit

    - name: astro-check
      run: bun run astro check
