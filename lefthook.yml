pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{css,js,jsx,json,jsonc,mjs,ts,tsx}"
      run: biome check --write {staged_files}

    - name: prettier-content
      glob: "*.{astro,md,mdx}"
      run: prettier --write {staged_files}

pre-push:
  jobs:
    - name: tsc
      glob: "*.{ts,tsx,mts,cts}"
      run: tsc --noEmit
