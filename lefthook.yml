pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: "*.{astro,css,js,json,jsonc,mjs,svelte,ts}"
      run: oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: oxlint
      glob: "*.{astro,js,json,jsonc,mjs,svelte,ts}"
      run: oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: rumdl
      glob: "*.{md,mdx}"
      run: rumdl fmt {staged_files}

    - name: tsc
      glob: "*.{ts,mts,cts}"
      run: tsc --noEmit

    - name: astro-check
      run: bun x astro check
