openapi: 3.1.0

info:
  title: Realtime API Protocol Docs
  version: 2.1.0
  description: |
    RESTful API 产品级协议规范的机器可读来源。

    本规范以资源为中心，描述频道、消息、会话、订阅和健康检查等 REST 资源的标准契约。
    共享的版本、认证、错误和分页口径与站内概念页保持一致。

    ## 这份规范适合读什么

    - 找到每个 REST 资源的用途和边界
    - 了解统一的认证、分页、错误和兼容性约定
    - 查看可复制的请求、响应和错误样例

    ## 版本约定

    - 2.1.x: 当前产品规范版本
    - 2.0.x: 向后兼容的前一版行为
    - 主版本变化表示破坏性变更

    ## 认证方式

    所有接口使用 Bearer Token 认证，在请求头中携带：

    ```
    Authorization: Bearer <token>
    ```

    ## 基础 URL

    - 生产环境: `https://api.example.com/v2`
    - 开发环境: `https://dev-api.example.com/v2`
  contact:
    name: API Support
    email: support@example.com
    url: https://docs.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com/v2
    description: 生产环境
  - url: https://dev-api.example.com/v2
    description: 开发环境

tags:
  - name: Channels
    description: 频道资源管理，涵盖创建、查询、更新和删除
  - name: Messages
    description: 消息资源管理，支持按频道创建和查询消息
  - name: Sessions
    description: 会话资源管理，支持查看和终止连接
  - name: Subscriptions
    description: 订阅资源管理，支持 MQTT Topic 和回调配置
  - name: Health
    description: 服务健康检查和部署探针

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: 健康检查
      description: 返回服务当前运行状态，无需认证。用于部署探针和快速连通性检查。
      operationId: getHealth
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl https://api.example.com/v2/health
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                version: 2.1.0
                uptime: 3600
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Channels ────────────────────────────────
  /channels:
    get:
      tags: [Channels]
      summary: 列出所有活跃频道
      description: 返回当前所有活跃频道及其在线人数。适合运维面板和频道管理页面。
      operationId: listChannels
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: type
          in: query
          description: 按协议类型过滤
          required: false
          schema:
            type: string
            enum: [websocket, sse, mqtt]
      responses:
        "200":
          description: 频道列表
          headers:
            X-Total-Count:
              description: 总频道数
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Channel"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
              example:
                data:
                  - id: ch_01HX
                    name: general
                    type: websocket
                    online: 42
                    created_at: "2025-01-01T00:00:00Z"
                  - id: ch_02HX
                    name: alerts
                    type: sse
                    online: 8
                    created_at: "2025-01-02T00:00:00Z"
                pagination:
                  page: 1
                  limit: 20
                  total: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl \
              -H "Authorization: Bearer <token>" \
              "https://api.example.com/v2/channels?page=1&limit=20"

    post:
      tags: [Channels]
      summary: 创建频道
      description: 创建一个新的实时频道，返回频道 ID 和连接信息。适合在产品后台预先开通一组实时目标。
      operationId: createChannel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
            example:
              name: sensor-data
              type: websocket
              private: false
              max_connections: 100
      responses:
        "201":
          description: 频道创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST "https://api.example.com/v2/channels" \
              -H "Authorization: Bearer <token>" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "sensor-data",
                "type": "websocket",
                "private": false,
                "max_connections": 100
              }'

  /channels/{channelId}:
    get:
      tags: [Channels]
      summary: 获取频道详情
      description: 返回单个频道的详细信息，包括类型、连接状态和容量限制。
      operationId: getChannel
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      responses:
        "200":
          description: 频道详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "404":
          $ref: "#/components/responses/NotFound"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl \
              -H "Authorization: Bearer <token>" \
              "https://api.example.com/v2/channels/ch_01HX"

    delete:
      tags: [Channels]
      summary: 删除频道
      description: 删除指定频道，同时断开所有连接到该频道的客户端。
      operationId: deleteChannel
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      responses:
        "204":
          description: 删除成功
        "404":
          $ref: "#/components/responses/NotFound"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X DELETE \
              -H "Authorization: Bearer <token>" \
              "https://api.example.com/v2/channels/ch_01HX"

  # ── Messages ────────────────────────────────
  /channels/{channelId}/messages:
    get:
      tags: [Messages]
      summary: 列出频道消息
      description: 返回指定频道下的消息集合，适合做投递历史、追踪和审计。
      operationId: listChannelMessages
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: since
          in: query
          description: 查询此时间戳之后的消息（Unix ms）
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl \
              -H "Authorization: Bearer <token>" \
              "https://api.example.com/v2/channels/ch_01HX/messages?page=1&limit=20"

    post:
      tags: [Messages]
      summary: 创建频道消息
      description: 以资源的方式在指定频道下创建一条消息。服务端会返回消息资源和投递结果。
      operationId: createChannelMessage
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
            examples:
              default:
                summary: 创建频道消息
                value:
                  event: chat.message
                  payload:
                    text: Hello World
                    userId: u_123
                  options:
                    ttl: 60
      responses:
        "201":
          description: 消息创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST "https://api.example.com/v2/channels/ch_01HX/messages" \
              -H "Authorization: Bearer <token>" \
              -H "Content-Type: application/json" \
              -d '{
                "event": "chat.message",
                "payload": {
                  "text": "Hello World",
                  "userId": "u_123"
                },
                "options": {
                  "ttl": 60
                }
              }'

  /messages:
    get:
      tags: [Messages]
      summary: 查询消息集合
      description: 查询跨频道的消息历史记录，用于排查投递结果和回溯事件。
      operationId: listMessages
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: channel_id
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          description: 查询此时间戳之后的消息（Unix ms）
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 历史消息列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl \
              -H "Authorization: Bearer <token>" \
              "https://api.example.com/v2/messages?page=1&limit=20"

  # ── Sessions ────────────────────────────────
  /sessions:
    get:
      tags: [Sessions]
      summary: 列出活跃会话
      description: 返回当前所有活跃的 WebSocket / SSE 连接会话。
      operationId: listSessions
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: protocol
          in: query
          schema:
            type: string
            enum: [websocket, sse]
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl \
              -H "Authorization: Bearer <token>" \
              "https://api.example.com/v2/sessions?page=1&limit=20&protocol=websocket"

  /sessions/{sessionId}:
    delete:
      tags: [Sessions]
      summary: 强制断开会话
      description: 强制断开指定的连接会话，可选地携带断开原因。
      operationId: deleteSession
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
          example: sess_01HX
        - name: reason
          in: query
          required: false
          description: 断开原因，会记录到审计日志
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: 断开状态码，默认使用 1000
          schema:
            type: integer
            default: 1000
      responses:
        "204":
          description: 会话已断开
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X DELETE \
              -H "Authorization: Bearer <token>" \
              "https://api.example.com/v2/sessions/sess_01HX"

  # ── Subscriptions ───────────────────────────
  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: 列出 MQTT 订阅
      description: 返回当前订阅配置，帮助确认 Topic、QoS 和回调地址。
      operationId: listSubscriptions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 订阅列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subscription"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl \
              -H "Authorization: Bearer <token>" \
              "https://api.example.com/v2/subscriptions"

    post:
      tags: [Subscriptions]
      summary: 创建 MQTT 订阅
      description: 创建一个新的 MQTT Topic 订阅，并可选配置消息回调地址。
      operationId: createSubscription
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
            example:
              topic: "sensors/#"
              qos: 1
              webhook_url: https://your-server.com/webhook
      responses:
        "201":
          description: 订阅成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST "https://api.example.com/v2/subscriptions" \
              -H "Authorization: Bearer <token>" \
              -H "Content-Type: application/json" \
              -d '{
                "topic": "sensors/#",
                "qos": 1,
                "webhook_url": "https://your-server.com/webhook"
              }'

  /subscriptions/{subscriptionId}:
    delete:
      tags: [Subscriptions]
      summary: 取消订阅
      description: 删除指定的 MQTT Topic 订阅。
      operationId: deleteSubscription
      security:
        - BearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 取消成功
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X DELETE \
              -H "Authorization: Bearer <token>" \
              "https://api.example.com/v2/subscriptions/sub_01HX"

# ─────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────
components:

  # ── Security ────────────────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        使用 JWT Token 认证。Token 从 `/auth/token` 接口获取。
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIs...
        ```

  # ── Parameters ──────────────────────────────
  parameters:
    ChannelIdParam:
      name: channelId
      in: path
      required: true
      description: 频道 ID
      schema:
        type: string
      example: ch_01HX

    PageParam:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # ── Responses ───────────────────────────────
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 400
            error: BAD_REQUEST
            message: 参数 name 不能为空

    ValidationError:
      description: 请求校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 422
            error: VALIDATION_ERROR
            message: 请求体字段不符合要求
            details:
              - field: name
                reason: minLength
                message: name 至少需要 1 个字符

    Conflict:
      description: 资源冲突，通常表示唯一键重复或状态不允许重复创建
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 409
            error: CONFLICT
            message: 频道名称已存在

    TooManyRequests:
      description: 请求频率过高
      headers:
        Retry-After:
          description: 建议重试前等待的秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 429
            error: RATE_LIMITED
            message: 请求过于频繁，请稍后重试

    Unauthorized:
      description: 未认证或 Token 过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 401
            error: UNAUTHORIZED
            message: Token 无效或已过期

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 404
            error: NOT_FOUND
            message: 指定资源不存在

    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 500
            error: INTERNAL_ERROR
            message: 服务器内部错误，请稍后重试

    ServiceUnavailable:
      description: 服务暂时不可用
      headers:
        Retry-After:
          description: 建议重试前等待的秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 503
            error: SERVICE_UNAVAILABLE
            message: 服务暂时不可用，请稍后重试

  # ── Schemas ─────────────────────────────────
  schemas:

    # Health
    HealthResponse:
      type: object
      required: [status, version, uptime]
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        version:
          type: string
          example: 2.1.0
        uptime:
          type: integer
          description: 服务运行秒数
          example: 3600

    # Channel
    Channel:
      type: object
      required: [id, name, type, online, created_at]
      properties:
        id:
          type: string
          example: ch_01HX
        name:
          type: string
          example: general
        type:
          type: string
          enum: [websocket, sse, mqtt]
        private:
          type: boolean
          default: false
        online:
          type: integer
          description: 当前在线连接数
          example: 42
        max_connections:
          type: integer
          nullable: true
          example: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateChannelRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9-_]+$"
          example: sensor-data
        type:
          type: string
          enum: [websocket, sse, mqtt]
        private:
          type: boolean
          default: false
        max_connections:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true

    # Message
    Message:
      type: object
      required: [id, channel_id, event, payload, created_at]
      properties:
        id:
          type: string
          example: msg_01HX
        channel_id:
          type: string
          example: ch_01HX
        target:
          type: string
          nullable: true
          description: 兼容字段，保留用于历史查询场景
          example: "channel:general"
        event:
          type: string
          example: chat.message
        payload:
          type: object
          additionalProperties: true
        options:
          $ref: "#/components/schemas/MessageOptions"
        delivered_to:
          type: integer
          nullable: true
          description: 成功投递到的连接数
        created_at:
          type: string
          format: date-time

    CreateMessageRequest:
      type: object
      required: [event, payload]
      properties:
        event:
          type: string
          description: 事件类型名称，建议使用 namespace.action 格式
          example: chat.message
        payload:
          type: object
          additionalProperties: true
          description: 消息内容，任意 JSON 对象
        options:
          $ref: "#/components/schemas/MessageOptions"

    MessageOptions:
      type: object
      properties:
        qos:
          type: integer
          enum: [0, 1, 2]
          description: MQTT QoS 等级（仅对 MQTT 订阅投递有效）
          default: 0
        retain:
          type: boolean
          description: MQTT Retain 标志（仅对 MQTT 订阅投递有效）
          default: false
        ttl:
          type: integer
          description: 消息存活秒数，超时后丢弃
          example: 60

    # Session
    Session:
      type: object
      required: [id, protocol, channel_id, connected_at]
      properties:
        id:
          type: string
          example: sess_01HX
        protocol:
          type: string
          enum: [websocket, sse]
        channel_id:
          type: string
          example: ch_01HX
        client_ip:
          type: string
          example: 192.168.1.1
        user_agent:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          description: 握手时携带的自定义元数据
        connected_at:
          type: string
          format: date-time
        last_ping_at:
          type: string
          format: date-time
          nullable: true

    # Subscription
    Subscription:
      type: object
      required: [id, topic, qos, created_at]
      properties:
        id:
          type: string
          example: sub_01HX
        topic:
          type: string
          description: MQTT Topic，支持 + 和 # 通配符
          example: "sensors/#"
        qos:
          type: integer
          enum: [0, 1, 2]
        webhook_url:
          type: string
          format: uri
          nullable: true
          description: 收到消息后回调的 Webhook 地址
          example: https://your-server.com/webhook
        created_at:
          type: string
          format: date-time

    CreateSubscriptionRequest:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
          example: "sensors/#"
        qos:
          type: integer
          enum: [0, 1, 2]
          default: 0
        webhook_url:
          type: string
          format: uri
          nullable: true

    # Pagination
    Pagination:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100

    # Error
    Error:
      type: object
      required: [code, error, message]
      properties:
        code:
          type: integer
          example: 400
        error:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: 参数错误
        request_id:
          type: string
          nullable: true
          description: 服务端用于排查问题的请求标识
          example: req_01HX
        retry_after_seconds:
          type: integer
          nullable: true
          description: 建议重试前等待的秒数
        details:
          type: array
          nullable: true
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: 发生错误的字段或资源路径
              message:
                type: string
              reason:
                type: string
                description: 可机器识别的原因码
