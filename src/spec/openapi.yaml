openapi: 3.1.0

info:
  title: RealtimeAPI
  version: 2.1.0
  description: |
    WebSocket、MQTT 5、SSE、REST 四种实时通信协议的统一管理接口。

    ## 认证方式
    所有接口使用 Bearer Token 认证，在请求头中携带：
    ```
    Authorization: Bearer <token>
    ```

    ## 基础 URL
    - 生产环境: `https://api.example.com/v2`
    - 开发环境: `https://dev-api.example.com/v2`
  contact:
    name: API Support
    email: support@example.com
    url: https://docs.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com/v2
    description: 生产环境
  - url: https://dev-api.example.com/v2
    description: 开发环境

tags:
  - name: Channels
    description: 频道管理，适用于 WebSocket / SSE 订阅
  - name: Messages
    description: 消息发布，支持 WebSocket、MQTT、SSE 推送
  - name: Sessions
    description: 连接会话管理
  - name: Subscriptions
    description: MQTT Topic 订阅管理
  - name: Health
    description: 服务健康检查

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: 健康检查
      description: 返回服务当前运行状态，无需认证。
      operationId: getHealth
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                version: 2.1.0
                uptime: 3600

  # ── Channels ────────────────────────────────
  /channels:
    get:
      tags: [Channels]
      summary: 列出所有活跃频道
      description: 返回当前所有活跃频道及其在线人数。
      operationId: listChannels
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: type
          in: query
          description: 按协议类型过滤
          required: false
          schema:
            type: string
            enum: [websocket, sse, mqtt]
      responses:
        "200":
          description: 频道列表
          headers:
            X-Total-Count:
              description: 总频道数
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Channel"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
              example:
                data:
                  - id: ch_01HX
                    name: general
                    type: websocket
                    online: 42
                    created_at: "2025-01-01T00:00:00Z"
                  - id: ch_02HX
                    name: alerts
                    type: sse
                    online: 8
                    created_at: "2025-01-02T00:00:00Z"
                pagination:
                  page: 1
                  limit: 20
                  total: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Channels]
      summary: 创建频道
      description: 创建一个新的实时频道，返回频道 ID 和连接信息。
      operationId: createChannel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
            example:
              name: sensor-data
              type: websocket
              private: false
              max_connections: 100
      responses:
        "201":
          description: 频道创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 频道名称已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{channelId}:
    get:
      tags: [Channels]
      summary: 获取频道详情
      operationId: getChannel
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      responses:
        "200":
          description: 频道详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Channels]
      summary: 删除频道
      description: 删除指定频道，同时断开所有连接到该频道的客户端。
      operationId: deleteChannel
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChannelIdParam"
      responses:
        "204":
          description: 删除成功
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Messages ────────────────────────────────
  /publish:
    post:
      tags: [Messages]
      summary: 发布消息
      description: |
        向指定目标推送消息，支持三种推送方式：

        | 方式 | target 格式 | 说明 |
        |------|------------|------|
        | WebSocket 频道 | `channel:general` | 推送到 WebSocket 频道所有订阅者 |
        | MQTT Topic | `mqtt:sensors/device-1/temp` | 发布到 MQTT Broker |
        | SSE 流 | `sse:alerts` | 推送到 SSE 事件流 |
      operationId: publishMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
            examples:
              websocket:
                summary: 推送到 WebSocket 频道
                value:
                  target: "channel:general"
                  event: chat.message
                  payload:
                    text: Hello World
                    userId: u_123
              mqtt:
                summary: 发布 MQTT 消息
                value:
                  target: "mqtt:sensors/device-1/temp"
                  event: sensor.update
                  payload:
                    value: 23.5
                    unit: "°C"
                  options:
                    qos: 1
                    retain: false
              sse:
                summary: 推送 SSE 事件
                value:
                  target: "sse:alerts"
                  event: alert.warning
                  payload:
                    level: warn
                    message: 设备温度超过阈值
      responses:
        "200":
          description: 消息发布成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 目标频道或 Topic 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /messages:
    get:
      tags: [Messages]
      summary: 查询历史消息
      operationId: listMessages
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: channel_id
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          description: 查询此时间戳之后的消息（Unix ms）
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 历史消息列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  # ── Sessions ────────────────────────────────
  /sessions:
    get:
      tags: [Sessions]
      summary: 列出活跃会话
      description: 返回当前所有活跃的 WebSocket / SSE 连接会话。
      operationId: listSessions
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: protocol
          in: query
          schema:
            type: string
            enum: [websocket, sse]
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  /sessions/{sessionId}:
    delete:
      tags: [Sessions]
      summary: 强制断开会话
      description: 强制断开指定的 WebSocket 或 SSE 连接。
      operationId: deleteSession
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
          example: sess_01HX
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 断开原因，会通过 WebSocket close frame 发送给客户端
                  example: 管理员手动断开
                code:
                  type: integer
                  description: WebSocket 关闭状态码
                  default: 1000
      responses:
        "204":
          description: 会话已断开
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Subscriptions ───────────────────────────
  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: 列出 MQTT 订阅
      operationId: listSubscriptions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 订阅列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subscription"

    post:
      tags: [Subscriptions]
      summary: 创建 MQTT 订阅
      operationId: createSubscription
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
            example:
              topic: "sensors/#"
              qos: 1
              webhook_url: https://your-server.com/webhook
      responses:
        "201":
          description: 订阅成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"

  /subscriptions/{subscriptionId}:
    delete:
      tags: [Subscriptions]
      summary: 取消订阅
      operationId: deleteSubscription
      security:
        - BearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 取消成功
        "404":
          $ref: "#/components/responses/NotFound"

# ─────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────
components:

  # ── Security ────────────────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        使用 JWT Token 认证。Token 从 `/auth/token` 接口获取。
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIs...
        ```

  # ── Parameters ──────────────────────────────
  parameters:
    ChannelIdParam:
      name: channelId
      in: path
      required: true
      description: 频道 ID
      schema:
        type: string
      example: ch_01HX

    PageParam:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # ── Responses ───────────────────────────────
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 400
            error: BAD_REQUEST
            message: 参数 name 不能为空

    Unauthorized:
      description: 未认证或 Token 过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 401
            error: UNAUTHORIZED
            message: Token 无效或已过期

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 404
            error: NOT_FOUND
            message: 指定资源不存在

    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 500
            error: INTERNAL_ERROR
            message: 服务器内部错误，请稍后重试

  # ── Schemas ─────────────────────────────────
  schemas:

    # Health
    HealthResponse:
      type: object
      required: [status, version, uptime]
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        version:
          type: string
          example: 2.1.0
        uptime:
          type: integer
          description: 服务运行秒数
          example: 3600

    # Channel
    Channel:
      type: object
      required: [id, name, type, online, created_at]
      properties:
        id:
          type: string
          example: ch_01HX
        name:
          type: string
          example: general
        type:
          type: string
          enum: [websocket, sse, mqtt]
        private:
          type: boolean
          default: false
        online:
          type: integer
          description: 当前在线连接数
          example: 42
        max_connections:
          type: integer
          nullable: true
          example: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateChannelRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9-_]+$"
          example: sensor-data
        type:
          type: string
          enum: [websocket, sse, mqtt]
        private:
          type: boolean
          default: false
        max_connections:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true

    # Message
    Message:
      type: object
      required: [id, target, event, payload, created_at]
      properties:
        id:
          type: string
          example: msg_01HX
        target:
          type: string
          example: "channel:general"
        event:
          type: string
          example: chat.message
        payload:
          type: object
          additionalProperties: true
        options:
          $ref: "#/components/schemas/MessageOptions"
        created_at:
          type: string
          format: date-time

    PublishRequest:
      type: object
      required: [target, event, payload]
      properties:
        target:
          type: string
          description: |
            推送目标，格式：
            - `channel:<name>` — WebSocket 频道
            - `mqtt:<topic>` — MQTT Topic
            - `sse:<name>` — SSE 事件流
          example: "channel:general"
        event:
          type: string
          description: 事件类型名称，建议使用 namespace.action 格式
          example: chat.message
        payload:
          type: object
          additionalProperties: true
          description: 消息内容，任意 JSON 对象
        options:
          $ref: "#/components/schemas/MessageOptions"

    MessageOptions:
      type: object
      properties:
        qos:
          type: integer
          enum: [0, 1, 2]
          description: MQTT QoS 等级（仅 mqtt target 有效）
          default: 0
        retain:
          type: boolean
          description: MQTT Retain 标志（仅 mqtt target 有效）
          default: false
        ttl:
          type: integer
          description: 消息存活秒数，超时后丢弃
          example: 60

    PublishResponse:
      type: object
      required: [message_id, delivered_to]
      properties:
        message_id:
          type: string
          example: msg_01HX
        delivered_to:
          type: integer
          description: 成功推送到的连接数
          example: 15
        timestamp:
          type: string
          format: date-time

    # Session
    Session:
      type: object
      required: [id, protocol, channel_id, connected_at]
      properties:
        id:
          type: string
          example: sess_01HX
        protocol:
          type: string
          enum: [websocket, sse]
        channel_id:
          type: string
          example: ch_01HX
        client_ip:
          type: string
          example: 192.168.1.1
        user_agent:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          description: 握手时携带的自定义元数据
        connected_at:
          type: string
          format: date-time
        last_ping_at:
          type: string
          format: date-time
          nullable: true

    # Subscription
    Subscription:
      type: object
      required: [id, topic, qos, created_at]
      properties:
        id:
          type: string
          example: sub_01HX
        topic:
          type: string
          description: MQTT Topic，支持 + 和 # 通配符
          example: "sensors/#"
        qos:
          type: integer
          enum: [0, 1, 2]
        webhook_url:
          type: string
          format: uri
          nullable: true
          description: 收到消息后回调的 Webhook 地址
          example: https://your-server.com/webhook
        created_at:
          type: string
          format: date-time

    CreateSubscriptionRequest:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
          example: "sensors/#"
        qos:
          type: integer
          enum: [0, 1, 2]
          default: 0
        webhook_url:
          type: string
          format: uri
          nullable: true

    # Pagination
    Pagination:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100

    # Error
    Error:
      type: object
      required: [code, error, message]
      properties:
        code:
          type: integer
          example: 400
        error:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: 参数错误
        details:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string