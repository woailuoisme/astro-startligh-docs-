services:
  docs:
    image: jiaoio/astro-startligh-docs:alpine
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4321:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
